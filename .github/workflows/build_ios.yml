name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cài đặt thư viện
        run: flutter pub get

      - name: Build ứng dụng iOS (Không cần chữ ký)
        run: flutter build ios --release --no-codesign

      - name: Đóng gói thành file .ipa
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qq -r app.ipa Payload

      - name: Xuất file IPA để tải về
        uses: actions/upload-artifact@v4
        with:
          name: Ung-Dung-Ghi-Chu-iOS
          path: app.ipa